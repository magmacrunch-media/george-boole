<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George Boole - Title Card</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(180deg, #0a0a14 0%, #16213e 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* CRT Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* Pixel grid overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 40%, rgba(138, 43, 226, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(0, 191, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            animation: retroglow 12s ease-in-out infinite;
        }

        @keyframes retroglow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.7; }
        }

        /* Square container - adjust this size for your thumbnail needs */
        .title-card {
            width: 800px;
            height: 800px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .title-main {
            text-align: center;
            animation: titleFloat 4s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .title-large {
            font-size: 64px;
            color: #00ffff;
            text-shadow: 
                4px 4px 0px #0066cc,
                0 0 25px rgba(0, 255, 255, 0.9);
            letter-spacing: 4px;
            margin-bottom: 30px;
            line-height: 1.3;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { 
                text-shadow: 
                    4px 4px 0px #0066cc,
                    0 0 25px rgba(0, 255, 255, 0.9);
            }
            50% { 
                text-shadow: 
                    4px 4px 0px #0066cc,
                    0 0 35px rgba(0, 255, 255, 1);
            }
        }

        .title-subtitle {
            font-size: 24px;
            color: #ff00ff;
            text-shadow: 
                3px 3px 0px #990099,
                0 0 15px rgba(255, 0, 255, 0.7);
            letter-spacing: 3px;
        }

        /* For smaller thumbnails (like 512x512), uncomment and adjust: */
        /*
        .title-card {
            width: 512px;
            height: 512px;
        }
        
        .title-large {
            font-size: 42px;
            margin-bottom: 20px;
        }
        
        .title-subtitle {
            font-size: 16px;
        }
        */
    </style>
</head>
<body>
    <div class="title-card">
        <div class="title-main">
            <h1 class="title-large">GEORGE<br>BOOLE</h1>
            <h2 class="title-subtitle">HAS ENTERED THE CHAT</h2>
        </div>
    </div>
</body>
</html>
