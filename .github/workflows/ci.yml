# The host tests need nothing but a C compiler, so they run on a GitHub-hosted
# runner rather than the dev box. These are the tests that must still run when
# that machine is off — tying them to it would undo the point of having them.
#
# One checkout, unlike Moonlight Drift's: this game's tests link only its own
# sources, so the engine is not needed here.
#
# The devkitPPC build below needs neither. It was held out of CI waiting on a
# self-hosted runner, which turned out to be a false lead: devkitPro publish the
# toolchain as a container, so the console build runs on a GitHub-hosted runner
# too. magnolia reached the same conclusion first; this is its engine-build job
# with the engine checked out beside the game, in the layout the Makefile
# already documents.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be run against a branch without opening a pull request first.
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The board, the gate rules and the mode tables — ported from the web
      # game and checked against the suite that came with it. The rules are what
      # a port gets wrong, and they are wrong in ways that look like being right.
      - name: make test
        working-directory: wii
        run: make test

  # The web version is the source of truth for rules and balance, and until
  # 2026-09-17 its own two suites ran nowhere in this repo. They ran only in the
  # website's `npm run check`, against the arcade/ copy, which exists only after
  # a `make sync-george-boole` -- so a break here surfaced a week later, in
  # another repo, at the moment somebody tried to deploy. That is exactly what
  # happened: 9f5651d made _emit call document.dispatchEvent, test-game.js runs
  # the game against a stub document without one, and an overflow threw out of
  # moveLeft() and silently skipped twelve scoring assertions behind it.
  #
  # Both scripts are plain Node with a hand-rolled harness and exit non-zero on
  # any failure, so there is nothing to install.
  web-tests:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: game logic
        run: node web/tests/test-game-logic.js
      - name: game against a stub DOM
        run: node web/tests/test-game.js
      - name: gate codex and discoveries
        run: node web/tests/test-codex.js

  # What `make test` cannot reach: everything bound to GRRLIB and libogc. The
  # host suite links this game's own sources and skips the engine entirely — by
  # design, so it stays runnable without a cross-compiler — which leaves the
  # console build with no automated check of any kind until this job.
  #
  # It is also the only thing that catches a game published against an engine
  # commit that was never pushed. That state builds perfectly on the dev box,
  # where both halves sit in one tree, and not at all from a fresh clone.
  wii-build:
    name: wii build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      # Checked out into a subdirectory so the engine can sit beside it. That
      # is the layout the Makefile documents and a flat clone produces, and it
      # means `make` here resolves the engine through its own first default
      # rather than through a MAGNOLIA= override this job would have to keep
      # correct. CI exercising the documented arrangement is the point.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: george-boole

      # Tracks main rather than a pinned ref, deliberately. An engine change
      # that breaks this game should redden this repo on the day it lands.
      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # GRRLIB is not a dkp-pacman package — it is built from source into the
      # portlibs tree. Its own dependencies (freetype, libpng, libjpeg-turbo)
      # come with the image's ppc-portlibs and wii-portlibs groups. Pinned, so
      # an upstream commit cannot turn this red on a day nobody touched it;
      # v4.6.1 matches what magnolia's own CI installs.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        working-directory: george-boole/wii
        run: make

      - name: The .dol exists
        run: test -f george-boole/wii/build/george-boole.dol

  # The same rules again, in the terminal port's Python. Deliberately a job with
  # no engine installed: boole/board.py and boole/modes.py claim to import
  # nothing outside the standard library, a test asserts it, and running them
  # here with nothing but pytest on the machine is what proves it.
  tui-rules:
    name: tui rules (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest ruff

      - name: Rules, with no engine on the machine
        working-directory: tui
        run: python -m pytest tests/test_board.py -q

      - name: Lint
        working-directory: tui
        run: ruff check .

  # The screens, which do need the engine and its terminal backend.
  tui-screens:
    name: tui screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # magmacrunch comes from pyproject.toml and is on PyPI, so there is
      # nothing to install by hand. It carries the engine and, through it,
      # textual and rich.
      - name: Install the game
        working-directory: tui
        run: pip install -e ".[dev]"

      - name: Full suite
        working-directory: tui
        run: python -m pytest -q

  # The other end of hypnopompia's drift check, and the end that catches the
  # likelier mistake. Since 2026-09-18 the Game Center plugin's two Swift files
  # are vendored from engines/hypnopompia, and editing them here is invisible
  # from both sides on its own: from this repo, because a copy always verifies
  # clean against itself, and from the shell, until somebody there happens to
  # run the check. This job notices at the moment the edit lands.
  #
  # Same layout as wii-build above: the shell is checked out beside this game so
  # its consumers.json resolves through the grouped path it already names,
  # rather than through a path this workflow would have to keep correct.
  # The art is committed, so drawing it and committing it are two acts and
  # nothing was checking the second had happened. makemecookies has had this
  # job since its art landed; this repo had no art job at all.
  ios-art:
    name: ios art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pillow
        run: pip install --quiet pillow

      # Checks the ids and formulas against tui/boole/modes.py, web/js/codex.js
      # and the achievements shim, the points table against what the script
      # actually builds, and then that an image exists for each id at 1024x1024
      # with no alpha. It draws nothing, so it needs no font and no website
      # checkout -- and it cannot compare pixels, because FreeType does not
      # rasterise identically across platforms. The header says why at length.
      - name: The Game Center art still matches the game
        run: python ios/tools/make-boards.py --check

  ios-shared:
    name: ios shared half
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game where consumers.json expects it
        uses: actions/checkout@v7
        with:
          path: games/george-boole

      # main rather than a pinned ref, for the same reason the engine checkout
      # above tracks main: a change in the shell that breaks this game should
      # redden this repo on the day it lands.
      - name: Check out the iOS shell beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: engines/hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The strict form, which exits 2 rather than 0 when it compared nothing,
      # so a checkout step that silently failed cannot read as a pass here.
      - name: The vendored plugin matches the shell
        working-directory: engines/hypnopompia
        run: npm run check

      # New coverage rather than a move: the metadata checker lived in this repo
      # and ran only when somebody remembered to run it before a submission.
      # Now that it takes a path, CI can hold the App Store Connect field limits
      # -- and the forbid-keywords note in metadata.md -- on every push.
      - name: Store metadata fits App Store Connect's limits
        run: node engines/hypnopompia/tools/check-metadata.mjs games/george-boole/ios

      # HOUSE.md has always said to check the ids against the shim before
      # creating anything in App Store Connect, because each one is permanent
      # and a deleted one cannot be reused. Nothing implemented that until now.
      # It exits 2 when there is nothing to check, so a missing art directory
      # cannot read as a clean result.
      - name: The Game Center ids and art are fit to create
        run: node engines/hypnopompia/tools/check-game-center.mjs games/george-boole/ios

  # The App Store build, and the first thing that runs package.mjs automatically.
  #
  # That is the real point of this job, more than the compile. package.mjs is 583
  # lines of guards whose purpose is to stop the bundle gaining something it must
  # not ship -- an unlisted ../shared/ script, a transform that silently stopped
  # matching, an asset fetched over the network -- and until now every one of them
  # fired only when somebody happened to run it on the dev box. The failure it was
  # written against is the website gaining a widget that reaches the App Store on
  # the next sync, and the website is a repo this one does not watch. Now it does:
  # the bundle is built here, from the website's main, on every push.
  #
  # macOS runner minutes are free on public repos, which is what makes this
  # affordable to run unconditionally rather than behind a path filter.
  ios-build:
    name: ios build
    runs-on: macos-latest
    steps:
      # The flat layout, which is findWebsite()'s SECOND candidate (../website
      # from the game root) and what a pair of plain clones produces. Same
      # reasoning as wii-build: CI exercises the arrangement the script already
      # documents, so there is no WEBSITE= override here to keep correct.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: george-boole

      # web/index.html names ../shared/* and pulls its font from the website, so
      # the bundle cannot be built from this repo alone. main rather than a pinned
      # ref, deliberately, and for the sharper of the two reasons: a script added
      # to the arcade's shared folder is exactly what package.mjs's allowlist
      # exists to refuse, and this is where that refusal now happens.
      - name: Check out the website beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magmacrunch.com
          path: website

      # The pipeline itself lives in the shell now, resolved by path the way the
      # Wii Makefiles resolve magnolia: `../hypnopompia` from the game root is
      # its second candidate, so this layout needs no HYPNOPOMPIA= override
      # either. A game that cannot find it fails by name rather than with a
      # module error three frames deep.
      - name: Check out the iOS shell beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Capacitor CLI
        working-directory: george-boole/ios
        run: npm ci

      # Split from cap sync so a failure is attributable. This step is the 14
      # transforms, the SHARED allowlist, the no-op-is-fatal rule, and the final
      # sweep for ../ paths and network assets.
      - name: Build the bundle from web/
        working-directory: george-boole/ios
        run: node package.mjs

      - name: Sync it into the Xcode project
        working-directory: george-boole/ios
        run: npx cap sync ios

      # A generic destination rather than the named simulator the local recipe
      # uses: "iPhone 17 Pro" exists on the dev Mac and need not exist on the
      # runner image, and nothing here needs a device to boot. Signing is off
      # because the simulator needs none. A device build or an archive would fail
      # on App.entitlements' Game Center capability until that is enabled for the
      # bundle id on the paid account, which is expected and is not this job's
      # business. Package.resolved is committed, so SPM resolves what the
      # 2026-09-17 build was verified against.
      - name: xcodebuild
        working-directory: george-boole/ios/App/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: The app was produced
        run: test -d "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"

      # Two things a successful compile does not prove on its own: that the
      # plugin's class survived into the binary, and that the privacy manifest
      # is in the bundle rather than only in the repo. Until now this job
      # compiled the app and stopped, so its green said the project builds and
      # said nothing about either -- and GameCenterPlugin.swift is vendored
      # from engines/hypnopompia, where a change arrives without anyone here
      # looking at it.
      #
      # App.debug.dylib is read as well as App, and that is not defensive:
      # since Xcode 16 a Debug build is split, the project's code going into
      # App.debug.dylib while App is a ~70KB launcher stub carrying none of
      # these classes. Checking App alone is how makemecookies' copy of this
      # step spent four days reporting a correctly wired project broken, which
      # is the worse failure of the two, because it sends you editing
      # project.pbxproj by hand.
      #
      # Matching the ObjC class symbol rather than the bare name is the other
      # half: registration goes through the ObjC runtime, so the class existing
      # is the thing worth asserting.
      #
      # Verified on the Mac before being added, rather than added and hoped
      # for: the plugin is in App.debug.dylib here too.
      - name: GameCenterPlugin and the privacy manifest are in the app
        run: |
          APP="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "PrivacyInfo.xcprivacy missing from the bundle"; exit 1; }
          found=""
          for bin in "$APP/App" "$APP/App.debug.dylib"; do
            [ -f "$bin" ] || continue
            if nm -a "$bin" 2>/dev/null | grep -qF '_OBJC_CLASS_$_GameCenterPlugin'; then
              found="$bin"; break
            fi
          done
          if [ -z "$found" ]; then
            echo "GameCenterPlugin not in the binary; looked in:"
            ls -la "$APP"/App "$APP"/App.debug.dylib 2>/dev/null
            exit 1
          fi
          echo "both present (plugin in $(basename "$found"))"
