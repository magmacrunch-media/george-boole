# The host tests need nothing but a C compiler, so they run on a GitHub-hosted
# runner rather than the dev box. These are the tests that must still run when
# that machine is off — tying them to it would undo the point of having them.
#
# One checkout, unlike Moonlight Drift's: this game's tests link only its own
# sources, so the engine is not needed here.
#
# The devkitPPC build below needs neither. It was held out of CI waiting on a
# self-hosted runner, which turned out to be a false lead: devkitPro publish the
# toolchain as a container, so the console build runs on a GitHub-hosted runner
# too. magnolia reached the same conclusion first; this is its engine-build job
# with the engine checked out beside the game, in the layout the Makefile
# already documents.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be run against a branch without opening a pull request first.
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The board, the gate rules and the mode tables — ported from the web
      # game and checked against the suite that came with it. The rules are what
      # a port gets wrong, and they are wrong in ways that look like being right.
      - name: make test
        working-directory: wii
        run: make test

  # The web version is the source of truth for rules and balance, and until
  # 2026-09-17 its own two suites ran nowhere in this repo. They ran only in the
  # website's `npm run check`, against the arcade/ copy, which exists only after
  # a `make sync-george-boole` -- so a break here surfaced a week later, in
  # another repo, at the moment somebody tried to deploy. That is exactly what
  # happened: 9f5651d made _emit call document.dispatchEvent, test-game.js runs
  # the game against a stub document without one, and an overflow threw out of
  # moveLeft() and silently skipped twelve scoring assertions behind it.
  #
  # Both scripts are plain Node with a hand-rolled harness and exit non-zero on
  # any failure, so there is nothing to install.
  web-tests:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: game logic
        run: node web/tests/test-game-logic.js
      - name: game against a stub DOM
        run: node web/tests/test-game.js
      - name: gate codex and discoveries
        run: node web/tests/test-codex.js

  # What `make test` cannot reach: everything bound to GRRLIB and libogc. The
  # host suite links this game's own sources and skips the engine entirely — by
  # design, so it stays runnable without a cross-compiler — which leaves the
  # console build with no automated check of any kind until this job.
  #
  # It is also the only thing that catches a game published against an engine
  # commit that was never pushed. That state builds perfectly on the dev box,
  # where both halves sit in one tree, and not at all from a fresh clone.
  wii-build:
    name: wii build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      # Checked out into a subdirectory so the engine can sit beside it. That
      # is the layout the Makefile documents and a flat clone produces, and it
      # means `make` here resolves the engine through its own first default
      # rather than through a MAGNOLIA= override this job would have to keep
      # correct. CI exercising the documented arrangement is the point.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: george-boole

      # Tracks main rather than a pinned ref, deliberately. An engine change
      # that breaks this game should redden this repo on the day it lands.
      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # GRRLIB is not a dkp-pacman package — it is built from source into the
      # portlibs tree. Its own dependencies (freetype, libpng, libjpeg-turbo)
      # come with the image's ppc-portlibs and wii-portlibs groups. Pinned, so
      # an upstream commit cannot turn this red on a day nobody touched it;
      # v4.6.1 matches what magnolia's own CI installs.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        working-directory: george-boole/wii
        run: make

      - name: The .dol exists
        run: test -f george-boole/wii/build/george-boole.dol

  # The same rules again, in the terminal port's Python. Deliberately a job with
  # no engine installed: boole/board.py and boole/modes.py claim to import
  # nothing outside the standard library, a test asserts it, and running them
  # here with nothing but pytest on the machine is what proves it.
  tui-rules:
    name: tui rules (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest ruff

      - name: Rules, with no engine on the machine
        working-directory: tui
        run: python -m pytest tests/test_board.py -q

      - name: Lint
        working-directory: tui
        run: ruff check .

  # The screens, which do need the engine and its terminal backend.
  tui-screens:
    name: tui screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # magmacrunch comes from pyproject.toml and is on PyPI, so there is
      # nothing to install by hand. It carries the engine and, through it,
      # textual and rich.
      - name: Install the game
        working-directory: tui
        run: pip install -e ".[dev]"

      - name: Full suite
        working-directory: tui
        run: python -m pytest -q
